<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#020805">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>SCHOOL SAVER AI — Owner Panel (Private)</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/owner-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316a34a'/%3E%3Ctext x='32' y='47' font-size='40' font-weight='900' text-anchor='middle' fill='%2302150a' font-family='Arial'%3ES%3C/text%3E%3C/svg%3E">
<style>
:root{--g:#22e46f;--g2:#0c7a3d;--bg:#020a05;--c1:#07170d;--c2:#030a05;--tx:#eaf7ee;--mu:#8fb09a;--rd:#ff4d4d;--am:#f5c518;--gold:#d4af37}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(circle at 20% 0,#102a14,var(--bg) 55%);color:var(--tx);font:14px system-ui,sans-serif;min-height:100vh}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{border-right:1px solid #8a7a2a;padding:12px;background:#030a0580;position:sticky;top:0;max-height:100vh;overflow-y:auto}
aside .logo{font-weight:900;font-size:17px;margin-bottom:2px}aside .logo b{color:var(--g)}
aside .priv{color:var(--gold);font-size:11px;margin-bottom:12px}
aside button{display:flex;gap:9px;width:100%;text-align:left;margin-bottom:3px;background:none;border:0;color:var(--tx);padding:9px 10px;border-radius:9px;font-size:13px;cursor:pointer}
aside button:hover{background:#0c3a1f55}aside button.on{background:linear-gradient(90deg,#b8941f,#d4af37);color:#1a1300;font-weight:700}
main{padding:16px 20px}
h2{color:var(--gold);margin-bottom:4px}h3{margin:16px 0 6px}p.sub{color:var(--mu);margin-bottom:12px}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.card{background:linear-gradient(160deg,var(--c1),var(--c2));border:1px solid #14a050;border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:inset 0 0 14px #0f6b3a40}
.card>h4{font-size:15px;margin-bottom:8px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.stat{text-align:center}.stat span{display:block;color:var(--mu);font-size:12px;margin-top:2px}.stat b{font-size:20px;color:var(--g)}.stat.gold b{color:var(--gold)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px;border-bottom:1px solid #123c2455;white-space:nowrap}th{color:var(--mu);font-weight:500}
input,select,textarea,button.b{font:inherit;color:var(--tx);background:#06180d;border:1px solid var(--g2);border-radius:9px;padding:8px;max-width:100%}
button.b{cursor:pointer}button.p{background:linear-gradient(90deg,#16a34a,#22e46f);color:#02150a;border:0;font-weight:700;border-radius:9px;padding:8px 12px;cursor:pointer}
button.d{background:var(--rd);color:#fff;border:0;border-radius:9px;padding:8px 12px;cursor:pointer}button.gold{background:linear-gradient(90deg,#b8941f,#d4af37);color:#1a1300;border:0;font-weight:700;border-radius:9px;padding:8px 12px;cursor:pointer}
form{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}form .full{grid-column:1/-1}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;background:#0c3a1f;color:var(--g)}.tag.r{background:#4a0e0e;color:var(--rd)}.tag.a{background:#453107;color:var(--am)}
.note{color:var(--mu);font-size:12px;margin:6px 0}.warn{border:1px solid var(--am);background:#453107aa;border-radius:10px;padding:10px;margin-bottom:12px;color:#ffe9a8}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px}#toast div{background:var(--gold);color:#1a1300;padding:9px 14px;border-radius:10px;font-weight:600}
#mb{display:none}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{position:fixed;left:-250px;top:0;width:240px;z-index:30;background:var(--bg);transition:.2s;height:100vh}aside.open{left:0}#mb{display:inline-block}}
</style>
</head>
<body>
<div class="app">
 <aside id="side"></aside>
 <main>
  <div class="top"><button class="b" id="mb" onclick="side.classList.toggle('open')">☰</button><div class="note">🔒 Private owner area · access is protected by the server · <button class="b" id="inst" style="display:none" onclick="installApp()">⬇ Install</button></div></div>
  <div id="main"></div>
 </main>
</div>
<div id="toast"></div>
<script>
/* Owner panel — mirrors the database group 12 (+ schools & subscriptions) exactly.
   DEMO storage: browser localStorage key "ssai_db" shared with the public app on this origin.
   Production: the same tables live in Supabase and RLS restricts them to company_admins. */
const DBK="ssai_db",$=id=>document.getElementById(id);
const uid=()=>(window.crypto&&crypto.randomUUID?crypto.randomUUID():"id-"+Date.now()+"-"+Math.random().toString(16).slice(2));
const DB={get(){try{return JSON.parse(localStorage.getItem(DBK))||{}}catch(e){return{}}},set(d){try{localStorage.setItem(DBK,JSON.stringify(d))}catch(e){}},tbl(n){return this.get()[n]||[]},
 add(n,r){const d=this.get();(d[n]=d[n]||[]).push(r);this.set(d);return r},
 upd(n,id,p){const d=this.get();const r=(d[n]||[]).find(x=>x.id==id);if(r)Object.assign(r,p);this.set(d);return r},
 audit(t,a,row){this.add("audit_logs",{id:uid(),school_id:row.school_id||(t=="schools"?row.id:null),table_name:t,action:a,row_id:row.id||"",new_data:row,occurred_at:new Date().toISOString()})}};
const kes=n=>"KES "+Math.round(+n||0).toLocaleString(),dt=x=>x?new Date(x).toLocaleString():"—",day=x=>x?String(x).slice(0,10):"—";
const toast=m=>{const d=document.createElement("div");d.textContent=m;$("toast").appendChild(d);setTimeout(()=>d.remove(),2600)};
const TYPES={ecde:"ECDE",primary:"Primary",junior_secondary:"Junior Secondary",senior_secondary:"Senior Secondary",tvet:"TVET",college:"College",university:"University"};
const PRICE={ecde:6000,primary:12000,junior_secondary:18000,senior_secondary:18000,tvet:24000,college:30000,university:60000};
const S={view:"overview",sel:null};
/* first open: a few fictional schools so the panel is not empty */
(function seed(){const d=DB.get();if(d._owner_seeded)return;d._owner_seeded=true;d.schools=d.schools||[];d.subscriptions=d.subscriptions||[];d.subscription_payments=d.subscription_payments||[];
 [["Sunrise Primary","primary","Kisumu","Mary A.","0711000001"],["Baraka ECDE","ecde","Nakuru","John K.","0711000002"],["Rift TVET Institute","tvet","Eldoret","Ann W.","0711000003"]].forEach(([n,t,c,h,p],i)=>{const id=uid(),sid=uid(),now=new Date(Date.now()-(i+2)*864e5*20).toISOString();
  d.schools.push({id,name:n+" (demo)",institution_type:t,registration_number:"DEMO-"+(100+i),county:c,head_name:h,phone:p,email:"",status:"active",created_at:now,verified_at:now});
  d.subscriptions.push({id:sid,school_id:id,plan:TYPES[t],annual_amount:PRICE[t],status:"active",starts_on:now.slice(0,10),renews_on:new Date(Date.parse(now)+365*864e5).toISOString().slice(0,10),created_at:now});
  d.subscription_payments.push({id:uid(),school_id:id,subscription_id:sid,amount:PRICE[t],provider:"M-PESA",reference:"DEMOPAY"+(1000+i),status:"verified",verified_at:now,created_at:now})});
 DB.set(d)})();
const sch=id=>DB.tbl("schools").find(x=>x.id==id)||{name:"(deleted school)"};
const sub=id=>DB.tbl("subscriptions").find(x=>x.school_id==id);
const tbl=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c??""}</td>`).join("")}</tr>`).join("")||`<tr><td colspan="${h.length}" class="note">No records yet</td></tr>`}</table></div>`;
const card=(h,b)=>`<div class="card">${h?`<h4>${h}</h4>`:""}${b}</div>`;
const stat=(v,l,g)=>`<div class="card stat ${g?"gold":""}"><b>${v}</b><span>${l}</span></div>`;
const tg=(s)=>`<span class="tag ${/active|verified|paid|approved|resolved/.test(s)?"":/pending|requested|open/.test(s)?"a":"r"}">${s}</span>`;
const fd=e=>{e.preventDefault();return Object.fromEntries(new FormData(e.target))};
/* money: verified subscription payments received by the company minus payout requests */
const revenue=()=>DB.tbl("subscription_payments").filter(p=>p.status=="verified").reduce((a,p)=>a+ +p.amount,0);
const pending=()=>DB.tbl("subscription_payments").filter(p=>p.status=="pending").reduce((a,p)=>a+ +p.amount,0);
const reserved=()=>DB.tbl("company_payouts").filter(p=>["requested","approved","paid"].includes(p.status)).reduce((a,p)=>a+ +p.amount,0);
const balance=()=>revenue()-reserved();
const NAV=[["overview","📊","Overview"],["schools","🏫","Schools & registrations"],["payments","💳","Subscriptions & payments"],["withdraw","💸","Withdraw earnings"],["support","🎧","Support tickets"],["audit","🧾","Audit logs"],["dbmap","🗄️","Database map"]];
function go(){
 if(!sessionStorage.getItem("ssai_owner_ok")){lockScreen();return}
 $("side").innerHTML=`<div class="logo">SCHOOL <b>SAVER AI</b></div><div class="priv">🔒 OWNER PANEL — PRIVATE</div>`+NAV.map(n=>`<button class="${n[0]==S.view?"on":""}" onclick="S.view='${n[0]}';S.sel=null;side.classList.remove('open');go()">${n[1]} ${n[2]}</button>`).join("")+`<button onclick="sessionStorage.removeItem('ssai_owner_ok');go()">🔒 Lock panel</button>`;
 $("main").innerHTML=V[S.view]();window.scrollTo(0,0)}
const V={
overview(){const sc=DB.tbl("schools"),by=k=>sc.filter(x=>x.status==k).length;
 return `<h2>Owner Overview</h2><p class="sub">Registrations, subscription revenue and platform health. Company administration is separate from school administration — it has no automatic access to student, medical or financial records.</p>
 <div class="grid">${stat(sc.length,"Registered schools")}${stat(by("pending_verification"),"Awaiting verification")}${stat(by("active"),"Active schools")}${stat(by("suspended"),"Suspended")}</div>
 <div class="grid">${stat(DB.tbl("subscriptions").filter(x=>x.status=="active").length,"Active subscriptions")}${stat(kes(revenue()),"Verified subscription revenue",1)}${stat(kes(pending()),"Payments awaiting verification")}${stat(kes(balance()),"Available to withdraw",1)}</div>`+
 card("Needs your attention",tbl(["Item","Detail",""],[...sc.filter(x=>x.status=="pending_verification").map(x=>["New school",x.name+" · "+TYPES[x.institution_type]+" · "+x.county,`<button class="b" onclick="S.view='schools';go()">Review</button>`]),...DB.tbl("subscription_payments").filter(x=>x.status=="pending").map(x=>["Payment",sch(x.school_id).name+" · "+kes(x.amount)+" · "+x.reference,`<button class="b" onclick="S.view='payments';go()">Verify</button>`]),...DB.tbl("support_tickets").filter(x=>x.status=="open").map(x=>["Support",x.subject,`<button class="b" onclick="S.view='support';go()">Open</button>`])]))+
 card("Platform monitoring",tbl(["Service","Status"],[["Public app","Online"],["Owner panel","Protected by server login"],["Database","Demo storage (Supabase in Build 03)"],["AI engine","Rules-based (Build 07)"]]))},
schools(){const sc=DB.tbl("schools").slice().reverse(),x=S.sel&&sc.find(y=>y.id==S.sel);
 return `<h2>Schools & registrations</h2><p class="sub">Every field below is a column of the <code>schools</code> table. Verify a school before it becomes active.</p>`+
 (x?card(x.name,tbl(["Field","Value"],[["institution_type",TYPES[x.institution_type]],["registration_number",x.registration_number||"—"],["county",x.county||"—"],["head_name",x.head_name],["phone",x.phone],["email",x.email||"—"],["status",tg(x.status)],["created_at",dt(x.created_at)],["verified_at",dt(x.verified_at)],["subscription",(sub(x.id)||{}).status||"none"]])+`<button class="b" onclick="S.sel=null;go()">Close</button>`):"")+
 tbl(["School","Type","County","Head","Phone","Registered","Status","Subscription",""],sc.map(s=>[s.name,TYPES[s.institution_type],s.county,s.head_name,s.phone,day(s.created_at),tg(s.status),(sub(s.id)||{}).status||"—",
 `<button class="b" onclick="S.sel='${s.id}';go()">Details</button> `+(s.status=="pending_verification"?`<button class="p" onclick="schSt('${s.id}','active')">Verify & activate</button>`:s.status=="active"?`<button class="d" onclick="schSt('${s.id}','suspended')">Suspend</button>`:s.status=="suspended"?`<button class="p" onclick="schSt('${s.id}','active')">Reactivate</button>`:"")]))},
payments(){const ps=DB.tbl("subscription_payments").slice().reverse();
 return `<h2>Subscriptions & payments</h2><p class="sub">Subscription money paid by schools to SCHOOL SAVER AI. Verify the reference with your M-PESA / bank statement, then verify here — the subscription activates for one year. (Demo: no real payments are processed.)</p>
 <div class="grid">${stat(kes(revenue()),"Verified revenue",1)}${stat(kes(pending()),"Awaiting verification")}${stat(DB.tbl("subscriptions").filter(x=>x.status=="active").length,"Active subscriptions")}</div>`+
 card("Payments (subscription_payments)",tbl(["When","School","Provider","Reference","Amount","Status",""],ps.map(p=>[dt(p.created_at),sch(p.school_id).name,p.provider,p.reference,kes(p.amount),tg(p.status),p.status=="pending"?`<button class="p" onclick="payVerify('${p.id}',true)">Verify</button> <button class="d" onclick="payVerify('${p.id}',false)">Reject</button>`:""])))+
 card("Subscriptions",tbl(["School","Plan","Annual amount","Status","Starts","Renews"],DB.tbl("subscriptions").map(s=>[sch(s.school_id).name,s.plan,kes(s.annual_amount),tg(s.status),day(s.starts_on),day(s.renews_on)])))+
 card("Illustrative annual prices (to be validated)",tbl(["Institution","Per year"],Object.entries(PRICE).map(([k,v])=>[TYPES[k],kes(v)])))},
withdraw(){const b=balance(),po=DB.tbl("company_payouts").slice().reverse();
 return `<h2>Withdraw earnings</h2><p class="sub">Your company revenue = verified subscription payments. This is SCHOOL SAVER AI's own money — never school fees or school funds.</p>
 <div class="warn">⚠️ DEMO MODE — no real money is sent. This records a withdrawal request. Real payouts will use an approved provider (M-PESA B2C / bank), a second approval step and a full audit trail.</div>
 <div class="grid">${stat(kes(revenue()),"Verified revenue")}${stat(kes(reserved()),"Requested / paid out")}${stat(kes(b),"Available to withdraw",1)}</div>`+
 card("Request withdrawal",`<form onsubmit="doWithdraw(event)"><input name="amt" type="number" min="1" max="${b}" placeholder="Amount (max ${b})" required><input name="dest" placeholder="M-PESA number or bank account (your own)" required><button class="gold full">💸 Withdraw (demo request)</button></form>`)+
 card("Withdrawal history (company_payouts)",tbl(["When","Amount","Destination","Status",""],po.map(p=>[dt(p.created_at),kes(p.amount),p.destination,tg(p.status),p.status=="requested"?`<button class="p" onclick="poSt('${p.id}','approved')">Approve</button> <button class="b" onclick="poSt('${p.id}','cancelled')">Cancel</button>`:p.status=="approved"?`<button class="p" onclick="poSt('${p.id}','paid')">Mark paid (demo)</button>`:""])))},
support(){return `<h2>Support tickets</h2><p class="sub">Requests from schools. Access to a school's private records needs a time-limited grant approved by that school (support_access_grants).</p>`+
 card("Open a ticket for a school",`<form onsubmit="addTicket(event)"><select name="sid">${DB.tbl("schools").map(s=>`<option value="${s.id}">${s.name}</option>`).join("")}</select><input name="s" placeholder="Subject" required><button class="p">Create</button></form>`)+
 tbl(["When","School","Subject","Status",""],DB.tbl("support_tickets").slice().reverse().map(t=>[dt(t.created_at),t.school_id?sch(t.school_id).name:(t.school_name||"—"),t.subject,tg(t.status),t.status=="open"?`<button class="p" onclick="tkSt('${t.id}','resolved')">Resolve</button>`:""]))},
audit(){return `<h2>Audit logs</h2><p class="sub">Platform-level actions (schools, subscriptions, payments, payouts, tickets). Entries cannot be deleted.</p>`+tbl(["When","Table","Action","Row","Detail"],DB.tbl("audit_logs").slice().reverse().slice(0,120).map(a=>[dt(a.occurred_at),a.table_name,a.action,String(a.row_id).slice(0,8),JSON.stringify(a.new_data||{}).slice(0,80)]))},
dbmap(){const G=[["01 School accounts","schools, school_settings, school_memberships, subscriptions"],["02 Users & permissions","users, roles, permissions, role_permissions, membership_extra_permissions, invitations"],["03 Students & guardians","students, guardians (parents), student_guardians, enrolments, admission_applications"],["04 Staff & departments","employees, departments, staff_assignments, contracts, leave_records"],["05 Academics","academic_terms, classes, subjects, lessons, examinations, marks, timetables"],["06 Attendance & access","class_attendance, access_devices, biometric_consents, biometric_templates, gate_events, collection_records, visitor_logs"],["07 School finance","fee_accounts, fee_charges, fee_payments, payment_allocations, fee_adjustments, budgets, income_records, expenses"],["08 School operations","suppliers, quotations, purchase_requests, purchase_orders, food_inventory, food_usage, assets, vehicles, trips, fuel_records, utility_records, maintenance_requests, sports_teams, sports_results"],["09 Education services","library_items, library_loans, dormitories, dorm_allocations, clinic_visits, medicine_stock, safeguarding_incidents"],["10 Communication","announcements, messages, notifications, parent_communications"],["11 AI & reporting","ai_alerts, ai_recommendations, forecasts, reports, analytics_snapshots"],["12 Company administration","company_admins, subscription_payments, company_payouts, support_tickets, support_access_grants, audit_logs"]];
 return `<h2>Database map</h2><p class="sub">This panel reads and writes the same tables as <code>database/schema.sql</code>. Tenant isolation is enforced by Row Level Security in <code>policies.sql</code>.</p>`+tbl(["Group","Tables"],G)}};
/* device lock (demo): passcode hash is kept on this device only. Real owner security = server login / Supabase company_admins. */
async function H(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("ssai-owner:"+t));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}
function lockScreen(){const has=localStorage.getItem("ssai_owner_lock");$("side").innerHTML="";$("main").innerHTML=`<div class="card" style="max-width:380px;margin:60px auto"><h4>🔒 Owner panel — private</h4><form onsubmit="unlock(event)"><input class="full" name="p" type="password" placeholder="${has?"Enter passcode":"Create a passcode (6+ characters)"}" required minlength="6"><button class="gold full">${has?"Unlock":"Set passcode"}</button></form><p class="note">Demo lock stored on this device only.</p></div>`}
async function unlock(e){const f=fd(e),h=await H(f.p),has=localStorage.getItem("ssai_owner_lock");if(!has)localStorage.setItem("ssai_owner_lock",h);else if(has!==h){toast("Wrong passcode");return}sessionStorage.setItem("ssai_owner_ok","1");go()}
/* actions */
function schSt(id,st){const r=DB.upd("schools",id,{status:st,verified_at:st=="active"?new Date().toISOString():undefined});DB.audit("schools","UPDATE",r);const s=sub(id);if(s&&st=="suspended"){DB.upd("subscriptions",s.id,{status:"suspended"})}if(s&&st=="active"&&s.status=="suspended"){DB.upd("subscriptions",s.id,{status:"active"})}toast("School "+st);go()}
function payVerify(id,ok){const p=DB.upd("subscription_payments",id,{status:ok?"verified":"rejected",verified_at:new Date().toISOString()});DB.audit("subscription_payments","UPDATE",p);
 if(ok){const s=sub(p.school_id);if(s){const now=new Date(),ren=new Date(now.getTime()+365*864e5);DB.upd("subscriptions",s.id,{status:"active",starts_on:now.toISOString().slice(0,10),renews_on:ren.toISOString().slice(0,10)})}const sc=DB.tbl("schools").find(x=>x.id==p.school_id);if(sc&&sc.status=="pending_verification")toast("Payment verified — now verify the school itself");}
 toast(ok?"Payment verified":"Payment rejected");go()}
function doWithdraw(e){const f=fd(e),a=+f.amt;if(!(a>0)||a>balance()){toast("Amount exceeds available balance");return}const r=DB.add("company_payouts",{id:uid(),amount:a,destination:f.dest,status:"requested",created_at:new Date().toISOString()});DB.audit("company_payouts","INSERT",r);toast("Withdrawal requested (demo — no money moved)");go()}
function poSt(id,st){const r=DB.upd("company_payouts",id,{status:st});DB.audit("company_payouts","UPDATE",r);toast("Payout "+st+(st=="paid"?" (demo)":""));go()}
function addTicket(e){const f=fd(e),r=DB.add("support_tickets",{id:uid(),school_id:f.sid,subject:f.s,status:"open",created_at:new Date().toISOString()});DB.audit("support_tickets","INSERT",r);go()}
function tkSt(id,st){const r=DB.upd("support_tickets",id,{status:st});DB.audit("support_tickets","UPDATE",r);go()}
/* submit works even where the viewer blocks native form submission */
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("form button");if(!b||b.type=="button")return;e.preventDefault();const f=b.form;if(f.reportValidity&&!f.reportValidity())return;f.dispatchEvent(new Event("submit",{cancelable:true,bubbles:true}))});
let dip=null;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();dip=e;$("inst").style.display="inline-block"});
function installApp(){if(dip){dip.prompt();dip.userChoice.finally(()=>{dip=null;$("inst").style.display="none"})}}
window.addEventListener("storage",()=>go());
go();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(()=>{});
</script>
<script id="ssai-owner-cloud">
/* ===== SCHOOL SAVER AI Owner Panel — cloud bridge + analytics (added; nothing above this block was changed) =====
   Signs the owner in against /api/auth/login (owner accounts only) and loads real schools and payments from Neon. */
(()=>{
const TK="ssai_owner_tok",KEY="ssai_owner_cloud",tok=()=>sessionStorage.getItem(TK);
const E=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(path,body){const o={method:body?"POST":"GET",headers:{"content-type":"application/json"}};if(tok())o.headers.authorization="Bearer "+tok();if(body)o.body=JSON.stringify(body);
 let r;try{r=await fetch(path,o)}catch(e){const x=new Error("offline");x.net=1;throw x}
 const j=await r.json().catch(()=>({}));if(!r.ok){const x=new Error(j.error||"Request failed");x.status=r.status;if(!j.error)x.net=1;if(r.status==401){sessionStorage.removeItem(TK);sessionStorage.removeItem("ssai_owner_ok")}throw x}return j}
const G0=DB.get,S0=DB.set;
